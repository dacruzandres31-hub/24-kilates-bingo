version: '3.8'

services:
  # Nginx - Reverse Proxy & Static Files
  nginx:
    image: nginx:alpine
    container_name: bingo24k-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client-player/dist:/var/www/bingo24k/client-player/dist:ro
      - ./client-admin/dist:/var/www/bingo24k/client-admin/dist:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bingo-network

  # Backend API (Node.js + Socket.IO)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: bingo24k-backend-prod
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - bingo-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bingo24k-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --max-connections=200 --innodb-buffer-pool-size=512M
    restart: unless-stopped
    networks:
      - bingo-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching & Session Store
  redis:
    image: redis:alpine
    container_name: bingo24k-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - bingo-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Certbot for SSL (Let's Encrypt)
  certbot:
    image: certbot/certbot
    container_name: bingo24k-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - bingo-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  bingo-network:
    driver: bridge
