server {
    listen 80;
    server_name 24kilates.xyz www.24kilates.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 24kilates.xyz www.24kilates.xyz;

    ssl_certificate /etc/letsencrypt/live/24kilates.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/24kilates.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend Admin - usando root con estructura /admin/
    location /admin {
        root /var/www/bingo24k/admin-root;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Frontend Player (catch-all)
    location / {
        root /var/www/bingo24k/client-player/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO
    location /socket.io {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection Upgrade;
        proxy_set_header Host $host;
    }
}
